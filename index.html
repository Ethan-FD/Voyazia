<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voyazia — Le monde à portée de clic</title>
<style>
:root{--navy:#102B5C;--royal:#1764E8;--mist:#DCEBFA;--bg:#F4F7FB;--card:#fff;--slate:#64748B;--night:#091A35;--ink:#102B5C;--sea:#EAF2FB;--land:#fff;--line:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--card:#13213c;--ink:#e8eefb;--sea:#0f1d36;--land:#26395e;--line:#24365a;--slate:#9fb0cc;--mist:#1c3158}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px;height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{margin:0;letter-spacing:-.02em}button{font:inherit;cursor:pointer}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;color:var(--ink);text-decoration:none}
.logo svg{width:28px;height:28px}.links{display:flex;gap:4px;margin:0 auto}
.links a{padding:8px 14px;border-radius:99px;color:var(--slate);text-decoration:none;font-weight:600;font-size:14px;transition:.2s}
.links a:hover,.links a.on{background:var(--mist);color:var(--ink)}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:700;background:var(--royal);color:#fff;transition:.2s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:var(--mist);color:var(--ink)}.btn.sm{padding:8px 14px;font-size:13px}
.wrap{max-width:1360px;margin:auto;padding:0 24px}
.hero{padding:44px 0 24px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;color:var(--royal)}
h1{font-size:clamp(34px,5.4vw,64px);line-height:1.02;margin:10px 0 14px}
.hero p{color:var(--slate);font-size:17px;max-width:540px;margin:0}
.sbox{position:relative}.sbox input{width:100%;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;box-shadow:0 6px 20px #10305c14}
.res{position:absolute;left:0;right:0;top:58px;background:var(--card);border-radius:16px;box-shadow:0 14px 40px #10305c30;z-index:20;overflow:hidden}
.res button{display:block;width:100%;text-align:left;padding:11px 16px;border:0;background:none;color:var(--ink)}.res button:hover{background:var(--mist)}
.cta{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}.cta a{color:var(--royal);font-weight:700;text-decoration:none}
.mapwrap{position:relative;border-radius:22px;overflow:hidden;background:var(--sea);height:clamp(380px,62vh,700px);box-shadow:0 10px 40px #10305c1c}
#map{width:100%;height:100%}
.jvm-container{background:transparent!important;position:relative;overflow:hidden;touch-action:none}.jvm-tooltip{display:none;position:absolute;background:var(--navy);color:#fff;padding:4px 9px;border-radius:8px;font-size:12px;white-space:nowrap;z-index:6}.jvm-tooltip.active{display:block}.jvm-region{transition:fill .25s}
.jvm-zoom-btn{position:absolute;left:16px;width:38px;height:38px;border-radius:12px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px #10305c25;cursor:pointer;user-select:none}
.jvm-zoomin{top:16px}.jvm-zoomout{top:62px}
.jvm-region.vis{fill:#102B5C!important}.jvm-region.wish{fill:#1764E8!important}.jvm-region.dim{opacity:.55}.jvm-region.cur{fill:#7fb2f5!important}
.tools{position:absolute;top:16px;right:16px;display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;box-shadow:0 4px 14px #10305c25;z-index:5}
.tools button{border:0;background:none;color:var(--slate);padding:7px 12px;border-radius:10px;font-weight:700;font-size:13px}.tools button.on{background:var(--navy);color:#fff}
.legend{position:absolute;left:16px;bottom:16px;background:var(--card);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;gap:12px;color:var(--slate);box-shadow:0 4px 14px #10305c25;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.panel{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--card);transform:translateX(105%);transition:transform .3s;z-index:10;overflow:auto;box-shadow:-10px 0 40px #10305c25}
.panel.open{transform:none}
.ph{height:150px;overflow:hidden;display:flex;align-items:flex-end;padding:16px;color:#fff;position:relative}.ph .fl{font-size:44px;line-height:1}
.x{z-index:2;position:absolute;top:10px;right:10px;border:0;background:#0006;color:#fff;border-radius:99px;width:34px;height:34px;font-size:18px}
.pb{padding:18px;display:grid;gap:12px}.pb h2{font-size:26px}.pb small{color:var(--slate)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}dt{color:var(--slate)}dd{margin:0;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 0;align-items:center}
.st{background:var(--card);border-radius:16px;padding:14px 16px}.st b{font-size:28px;display:block}.st span{color:var(--slate);font-size:13px}
.msg{grid-column:1/-1;background:var(--navy);color:#fff;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
section{padding:56px 0}h2.t{font-size:clamp(26px,3.4vw,40px);margin-bottom:22px}
.mosaic{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:14px}
.tile{border:0;border-radius:20px;color:#fff;text-align:left;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transition:.25s;position:relative;overflow:hidden}
.tile:hover{transform:scale(1.015)}.tile b{font-size:20px}.tile span{opacity:.9;font-size:13px}.tile em{position:absolute;top:14px;left:16px;font-style:normal;font-size:11px;letter-spacing:.1em;background:#ffffff30;padding:3px 9px;border-radius:99px}
.t1{grid-column:span 3;grid-row:span 2}.t2{grid-column:span 3}.t3{grid-column:span 3}.t4{grid-column:span 2}.t5{grid-column:span 2}.t6{grid-column:span 2}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.four .tile{height:230px}
.dark{background:var(--night);color:#fff;border-radius:28px;padding:48px;text-align:center}.dark p{opacity:.8}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--mist);padding:7px 12px;border-radius:99px;font-weight:600;font-size:14px;border:0;color:var(--ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:22px;padding:26px;max-width:440px;width:90%;background:var(--card);color:var(--ink)}dialog::backdrop{background:#091a3599}
dialog input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin:12px 0;background:var(--bg);color:var(--ink);font:inherit}
footer{padding:30px 0 50px;color:var(--slate);font-size:13px}
@media(max-width:860px){.hero{grid-template-columns:1fr}.links{order:3;width:100%;overflow-x:auto;margin:0}.stats{grid-template-columns:1fr 1fr}.mosaic{grid-template-columns:1fr 1fr}.mosaic .tile{grid-column:span 1!important;grid-row:span 1!important;grid-row:auto}.four{grid-template-columns:1fr 1fr}.wrap{padding:0 14px}nav{padding:10px 14px}.mapwrap{height:68vh}
.panel{top:auto;width:100%;height:62%;transform:translateY(105%);border-radius:22px 22px 0 0}.panel.open{transform:none}.tools{top:auto;bottom:16px;right:16px}.legend{display:none}.dark{padding:30px 18px}}
.mb{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:8px 0 6px}.mb i{font-style:normal;text-align:center;font-size:11px;padding:6px 0;border-radius:6px;background:var(--bg);color:var(--slate)}.mb i.on{background:var(--royal);color:#fff;font-weight:800}#lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-size:13px}.warn{background:#fff4e5;color:#8a4b00;padding:10px 12px;border-radius:12px;font-size:13px;margin:0}.legend s{text-decoration:none}</style></head><body>

matchMedia("(prefers-color-scheme:dark)").onchange=()=>location.reload();
function paint(){document.querySelectorAll(".jvm-region").forEach(p=>{const c=p.getAttribute("data-code");p.classList.toggle("vis",mode!=="envies"&&st.v.includes(c));p.classList.toggle("wish",mode==="envies"&&st.w.includes(c));p.classList.toggle("dim",mode==="carnet"&&!st.v.includes(c));p.classList.toggle("cur",c===cur)})}
$("#tools").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;document.querySelectorAll("#tools button").forEach(x=>x.classList.toggle("on",x===b));paint()};
const info=d=>`<dl><dt>${t("cap")}</dt><dd>${tr(d.cap)}</dd><dt>${t("lng")}</dt><dd>${d.l.map(ln).join(", ")}</dd><dt>${t("cur")}</dt><dd>${cn(d.cur)}</dd><dt>${t("bud")}</dt><dd>${t("perDay").replace("{n}",d.b)}</dd></dl>`;
const best=d=>`<div><b style="font-size:14px">${t("best")}</b>${bar(d.m)}<small>${ranges(d.m)}</small></div>`;
function panel(c){cur=c;const d=D[c],p=$("#panel"),v=st.v.includes(c),f=st.f.includes(c),w=st.w.includes(c);
p.innerHTML=`<div class="ph">${scene(c)}<button class="x" data-a="close" aria-label="${t("close")}">×</button><span class="fl" style="position:relative;filter:drop-shadow(0 2px 6px #0006)">${flag(c)}</span></div><div class="pb"><div><h2>${nm(c)}</h2><small>${d?t("c_"+d.k):t("noDetail")}</small></div>${d?`<p style="margin:0;color:var(--slate)">${dtext(c)}</p>${d.w?`<p class="warn">${t("warn")}</p>`:""}${info(d)}${best(d)}`:`<p style="margin:0;color:var(--slate)">${t("soon")}</p>`}
<div class="row"><button class="btn" data-a="v" data-c="${c}">${v?t("isV"):t("markV")}</button><button class="btn ghost" data-a="f" data-c="${c}">${f?t("isFav"):t("fav")}</button><button class="btn ghost" data-a="w" data-c="${c}">${w?t("isWish"):t("wish")}</button></div>${d?`<button class="btn ghost" data-a="disc" data-c="${c}">${t("disc")}</button>`:""}</div>`;
p.classList.add("open");paint()}
$("#panel").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,c=b.dataset.c;if(a==="close")closeP();else if(a==="disc")disc(c);else act(a,c)};
function closeP(){cur=null;$("#panel").classList.remove("open");paint()}
function disc(c){const d=D[c];$("#disc").innerHTML=`<div class="ph" style="border-radius:14px;margin-bottom:14px">${scene(c)}</div><h3>${flag(c)} ${nm(c)}</h3><p style="color:var(--slate)">${dtext(c)}</p>${d.w?`<p class="warn">${t("warn")}</p>`:""}<b>${t("mustSee")}</b><ul>${d.hl.map(x=>`<li>${tr(x)}</li>`).join("")}</ul>${best(d)}<p></p><button class="btn" onclick="this.closest('dialog').close()">${t("close")}</button>`;$("#disc").showModal()}
function locate(c){document.getElementById("carte").scrollIntoView();try{map.setFocus({region:c,animate:true})}catch(e){}panel(c)}
const q=$("#q"),res=$("#res"),norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
q.oninput=()=>{const x=norm(q.value.trim());if(!x){res.hidden=true;return}const m=Object.keys(paths).filter(c=>norm(nm(c)).includes(x)||norm(paths[c].name||"").includes(x)).slice(0,6);res.hidden=false;res.innerHTML=m.length?m.map(c=>`<button data-c="${c}">${flag(c)} ${nm(c)}</button>`).join(""):`<button disabled>${t("noRes")}</button>`};
res.onclick=e=>{const b=e.target.closest("[data-c]");if(b){locate(b.dataset.c);res.hidden=true;q.value=nm(b.dataset.c)}};
q.onkeydown=e=>{if(e.key==="Enter"){const b=res.querySelector("[data-c]");if(b)b.click()}};
function stats(){const cont=new Set(st.v.filter(c=>D[c]).map(c=>D[c].k)),n=Object.keys(paths).length;
$("#stats").innerHTML=!user?`<div class="msg"><div><b>${t("startT")}</b><br>${t("startP")}</div><button class="btn" onclick="login()">${t("login")}</button></div>`:!st.v.length?`<div class="msg"><div><b>${t("firstT")}</b><br>${t("firstP")}</div></div>`:`<div class="st"><b>${st.v.length}</b><span>${t("stV")}</span></div><div class="st"><b>${cont.size}</b><span>${t("stC")}</span></div><div class="st"><b>${n-st.v.length}</b><span>${t("stL")}</span></div><div class="st"><b>${Math.round(st.v.length/n*100)}%</b><span>${t("stP")}</span></div>`}
const chips=a=>a.length?`<div class="chips">${a.map(c=>`<button class="chip" data-c="${c}">${flag(c)} ${nm(c)}</button>`).join("")}</div>`:`<span style="color:var(--slate)">${t("none")}</span>`;
let sel=null;
function adv(){$("#adv").innerHTML=(sel?`<p><b>${t("sel")} « ${t("k_"+sel)} »</b></p>${chips(Object.keys(D).filter(c=>D[c].t===sel))}`:"")+(user?`<p><b>${t("favT")}</b></p>${chips(st.f)}<p><b>${t("wishT")}</b></p>${chips(st.w)}`:`<p style="color:var(--slate)">${t("needAcc")}</p><button class="btn" onclick="login()">${t("createAcc")}</button>`);$("#loginBtn").textContent=user?t("logout")+" ("+user+")":t("login")}
$("#adv").onclick=e=>{const b=e.target.closest("[data-c]");if(b)locate(b.dataset.c)};
const feat=[["JP","t1"],["IS","t2"],["GR","t3"],["IT","t4"],["PE","t5"],["NZ","t6"]],wants=[["w1","plage","#f59e0b,#e11d48"],["w2","aventure","#16a34a,#0f3d3e"],["w3","culture","#6d28d9,#102B5C"],["w4","gastronomie","#ea580c,#7c2d12"]];
function tiles(){$("#mosaic").innerHTML=feat.map(([c,k])=>`<button class="tile ${k}" style="background:linear-gradient(160deg,${D[c].g})" data-c="${c}"><em>${t("k_"+D[c].t).toUpperCase()}</em><b>${tr(D[c].hl[0])}</b><span>${nm(c)}</span></button>`).join("");
$("#four").innerHTML=wants.map(([w,k,g])=>`<button class="tile" style="background:linear-gradient(160deg,${g})" data-k="${k}"><b>${t(w)}</b><span>${t("seeSel")}</span></button>`).join("")}
$("#mosaic").onclick=e=>{const b=e.target.closest("[data-c]");if(b)locate(b.dataset.c)};
$("#four").onclick=e=>{const b=e.target.closest("[data-k]");if(b){sel=b.dataset.k;adv();document.getElementById("aventures").scrollIntoView()}};
$("#favBtn").onclick=()=>document.getElementById("aventures").scrollIntoView();
function refresh(){paint();stats();adv()}
function applyLang(){document.documentElement.lang=L;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));$("#lang").value=L;document.title="Voyazia — "+t("eyebrow").toLowerCase();tiles();refresh();if(cur)panel(cur);q.oninput()}
$("#lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("vz_lang",L)}catch(x){}applyLang()};
load();applyLang();setTimeout(refresh,50);
</script>
<script src="photos.js"></script>
<script src="offers.js"></script>
</body></html>
